networks:
  ryancarlo_network:
    driver: bridge
#  AS needed if there are more tech stack across different folder names
#  shared-mage-net:
#    external: true

volumes:
  redis_data:
  mariadb_data:

services:

  mariadb118:
    image: mariadb:11.8
    container_name: mariadb118
    restart: unless-stopped
    environment:
      # CORRECTION: Added missing mariadb environment variables
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    networks:
      - ryancarlo_network

    #image: php:8.4-fpm
  php84:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.4-fpm
        RUN docker-php-ext-install pdo_mysql
    container_name: php84
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./hrecs:/var/www/hrecs
    networks:
      - ryancarlo_network

  #FASTAPI PYTHON BACKEND POD
  pybackend:
    image: python:3.11-slim
    container_name: pybackend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app:z
    command: >
      bash -c "apt-get update && apt-get install -y --no-install-recommends build-essential && \
               pip install --no-cache-dir -r requirements.txt && \
               uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - REDIS_URL=redis://redis:6379/3
      - CELERY_BROKER_URL=redis://redis:6379/4
#      - OTHER_BASE_URL=${MAGENTO_BASE_URL:-http://mage_nginx/shop}
#      - OTHER_AUTH_TOKEN=${MAGENTO_AUTH_TOKEN:-}
      - UPLOAD_DIR=/tmp/catalog_uploads
      - DB_HOST=mariadb118
    env_file:
      - .env
    ports:
      - "18003:8000"
    depends_on:
      mariadb118:
        condition: service_healthy
    networks:
      - ryancarlo_network

  #REACT TSX here
  reactfrontend:
    image: node:20-alpine
    container_name: reactfrontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app:z
    command: >
      sh -c "npm install && npx tsc --noEmit && npm run dev -- --host 0.0.0.0 --port 3000"
    networks:
      - ryancarlo_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "13003:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./hrecs:/var/www/hrecs
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - php84
      - pybackend
      - reactfrontend
    networks:
      - ryancarlo_network

  flaretunnel:
    image: cloudflare/cloudflared:latest
    container_name: flaretunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    networks:
      - ryancarlo_network

