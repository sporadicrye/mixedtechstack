server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    # --------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Global FastCGI Settings (Prevents 502 Bad Gateway timeouts)
    fastcgi_connect_timeout 300s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 256k;
    fastcgi_busy_buffers_size 256k;

    # Even when php8.4 or higher is patched still safeguard against php2shell vulnerability!
    # Hide Nginx version from scanners
    server_tokens off;

    # FIXED PHP Argument Injection & Stream Wrapper Shield
    # Catches literal (-), URL-encoded (%2d), and Soft-Hyphen (%ad) flags (-d, -s, -n, etc.)
    #if ($query_string ~* "(?:^|\?|&)(?:-|%(?:2d|ad))(?:d|s|n|c|w|g|b|q|v|i|h)") {
    #    return 403;
    #}

    # Block PHP2Shell RCE wrappers in Query String (php://input, data://, expect://, phar://)
    #if ($query_string ~* "(?:php|data|expect|phar|zip|glob)://") {
    #    return 403;
    #}
    #if ($query_string ~* "(?:auto_prepend_file|auto_append_file|allow_url_include)") {
    #    return 403;
    #}

    # Block hidden files (.env, .git, .htaccess)
    #location ~ /\.(?!well-known).* {
    #    deny all;
    #    access_log off;
    #    log_not_found off;
    #}


    # ============================================
    # 1. PHP 8.4 (/hrecs)
    # ============================================
    # CRITICAL WEBSHELL BLOCK: Never allow .php execution in writable/upload folders
    # Adjust folder names (uploads, media, var, pub/media for Magento) to match your app
    location ~* ^/hrecs/(?:uploads|media|files|storage|var|tmp)/.*\.php$ {
        deny all;
    }

    location /hrecs {
        root /var/www;
        #alias /var/www/hrecs;                # or root with equivalent path resolution
        index index.php;

        # Scoped PHP Argument Injection & Stream Wrapper Shield (Only affects /hrecs)
        if ($request_uri ~* "(?:\?|&)(?:-|%(?:2d|ad))(?:d|s|n|c|w|g|b|q|v|i|h)") {
            return 403;
        }
        if ($request_uri ~* "(?:php|data|expect|phar|zip|glob)://") {
            return 403;
        }
        if ($query_string ~* "(?:auto_prepend_file|auto_append_file|allow_url_include)") {
            return 403;
        }

        try_files $uri $uri/ /hrecs/index.php?$query_string;

        location ~ \.php$ {

            # Block CVE-2019-11043 (PHP-FPM RCE) & Ghost Script execution
            # Ensures the physical .php file actually exists on disk before passing to FPM
            try_files $uri =404;

            # Prevent Path Info manipulation (e.g. /upload/image.jpg/shell.php)
            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            include fastcgi_params;
            fastcgi_pass php84:9000;
            #fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param DOCUMENT_ROOT   /var/www/hrecs;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Hardcode PATH_INFO Empty & Mitigate HTTPoxy (CVE-2016-5385)
            fastcgi_param PATH_INFO "";
            fastcgi_param HTTP_PROXY "";
        }
    }

    # ============================================
    # 2. FASTAPI BACKEND (/api/)
    # ============================================
    location /api/ {
        proxy_pass         http://pybackend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        client_max_body_size 25m;
    }

    # ============================================
    # 3. REACT FRONTEND (Root Level)
    # ============================================
    #/* CORRECTION: / served from react dist, not Vite proxy, for production */
    #location / {
    #    root       /usr/share/nginx/html;
    #    try_files  $uri $uri/ /index.html;
    #    expires    1h;
    #    add_header Cache-Control "public";
    #}
    location / {
        set $frontend_upstream "http://reactfrontend:3000";
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite hot-reloading & asset exceptions
    location ~ ^/(src|node_modules|@vite|@react-refresh|\.vite) {
        set $frontend_upstream "http://reactfrontend:3000";
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ============================================
    # 4. SECURITY (Deny hidden files)
    # ============================================
    location ~ /\.(?!vite) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Silently drop favicon requests without logging an error
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204; # 204 No Content
    }

    # Silently drop source map requests to prevent 401 log spam
    location ~ \.map$ {
        access_log off;
        log_not_found off;
        return 404;
    }
}
