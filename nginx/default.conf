server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    # --------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Global FastCGI Settings (Prevents 502 Bad Gateway timeouts)
    fastcgi_connect_timeout 300s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 256k;
    fastcgi_busy_buffers_size 256k;

    # ============================================
    # 1. PHP 8.4 (/hrecs)
    # ============================================
    location /hrecs {
        root /var/www;
        #alias /var/www/hrecs;                # or root with equivalent path resolution
        index index.php;
        try_files $uri $uri/ /hrecs/index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php84:9000;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param DOCUMENT_ROOT   /var/www/hrecs;
        }
    }

    # ============================================
    # 2. FASTAPI BACKEND (/api/)
    # ============================================
    location /api/ {
        proxy_pass         http://pybackend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        client_max_body_size 25m;
    }

    # ============================================
    # 3. REACT FRONTEND (Root Level)
    # ============================================
    #/* CORRECTION: / served from react dist, not Vite proxy, for production */
    #location / {
    #    root       /usr/share/nginx/html;
    #    try_files  $uri $uri/ /index.html;
    #    expires    1h;
    #    add_header Cache-Control "public";
    #}
    location / {
        set $frontend_upstream "http://reactfrontend:3000";
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite hot-reloading & asset exceptions
    location ~ ^/(src|node_modules|@vite|@react-refresh|\.vite) {
        set $frontend_upstream "http://reactfrontend:3000";
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ============================================
    # 4. SECURITY (Deny hidden files)
    # ============================================
    location ~ /\.(?!vite) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Silently drop favicon requests without logging an error
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204; # 204 No Content
    }

    # Silently drop source map requests to prevent 401 log spam
    location ~ \.map$ {
        access_log off;
        log_not_found off;
        return 404;
    }
}
